name: Build Native AOT

on:
  release:
    types: [published]

jobs:
  build_project:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            zip_name: Pokefight-Remastered-win-x64.zip
            publish_path: bin/Release/net9.0/win-x64/publish/
          - os: ubuntu-latest
            rid: linux-x64
            zip_name: Pokefight-Remastered-linux-x64.zip
            publish_path: bin/Release/net9.0/linux-x64/publish/
          - os: macos-latest
            rid: osx-x64
            zip_name: Pokefight-Remastered-osx-x64.zip
            publish_path: bin/Release/net9.0/osx-x64/publish/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore

      - working-directory: ${{ github.workspace }}
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishAot=true

      - env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          zip -r ${{ matrix.zip_name }} ${{ matrix.publish_path }} -j
          gh release upload ${{ github.event.release.tag_name }} ${{ matrix.zip_name }}
        shell: bash
